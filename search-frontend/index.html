<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Distributed Search Engine - Portafolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <!-- Cambiamos bg-slate-900 por bg-white y el texto a gris oscuro para que sea legible -->
  <body class="bg-white text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header / Título -->
    <header class="py-6 px-8 border-b border-slate-200">
      <div class="max-w-4xl mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-tight text-indigo-600">🔍 Serch Engine by @sergiodgtzdev</h1>
        <span class="text-xs bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full border border-indigo-200 font-medium">.NET 10 + Redis + Python + JS</span>
      </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-4xl mx-auto px-4 py-12 w-full flex-grow">
      
      <!-- Sección de Búsqueda -->
      <div class="text-center mb-10">
        <h2 class="text-3xl font-extrabold mb-3 text-slate-900">Se(a)rch for something</h2>
        <p class="text-slate-500 text-sm mb-6">Smart search engine powered by .NET, Redis, and Python</p>
        
        <!-- Formulario de Búsqueda -->
        <div class="flex gap-2 max-w-xl mx-auto">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Example: C# design patterns, Python async, etc..." 
            class="flex-grow px-4 py-3 bg-white border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-600 text-sm placeholder-slate-400 text-slate-900 shadow-sm"
          />
          <button 
            id="searchButton" 
            class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-medium text-sm transition-colors duration-200 flex items-center justify-center shadow-sm"
          >
            Buscar
          </button>
        </div>
      </div>

      <!-- Cache status -->
      <div id="statusContainer" class="hidden mb-6 p-4 rounded-lg bg-slate-50 border border-slate-200 text-sm flex items-center justify-between shadow-sm">
        <span id="statusText" class="text-slate-600">Esperando consulta...</span>
        <span id="badgeCache" class="px-1.5 py-0.5 rounded text-xs font-semibold"></span>
      </div>

      <!-- Contenedor de Resultados -->
      <div id="resultsContainer" class="space-y-4">
        <!-- Aquí inyectaremos los resultados dinámicamente con JavaScript -->
      </div>
      <div id="paginationContainer" class="mt-6 flex justify-center space-x-2">
        <!-- Aquí inyectaremos la paginación dinámicamente con JavaScript -->

    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-400 border-t border-slate-200">
      Desarrollado como proyecto de arquitectura de software y desarrollo Fullstack.
    </footer>

    <!-- Script Principal de JavaScript -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
